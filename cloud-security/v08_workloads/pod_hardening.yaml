# Illustrative, not run here: check the current docs
# Same on AKS, GKE and EKS: a pod with as little power as possible
apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  containers:
  - name: web
    image: registry.example.com/shop/web@sha256:<digest>
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
