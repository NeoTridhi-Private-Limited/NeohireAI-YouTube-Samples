trigger:
  branches:
    include: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"
  - script: python -m unittest -v
    displayName: Run tests
  - script: python deploy.py
    displayName: Deploy
    condition: eq(variables['Build.SourceBranchName'], 'main')
    env:
      DEPLOY_TOKEN: $(DEPLOY_TOKEN)
